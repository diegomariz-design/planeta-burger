<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planeta Burger 👽 — Cardápio</title>
<style>
  :root{
    --bg:#04090b; --panel:#0c2129; --panel2:#102b34; --petroleo2:#06181d;
    --turquesa:#0fb8c4; --neon:#39ff5b; --amarelo:#ffd02e; --texto:#eafff2;
    --cinza:#9fc4c9; --cinza2:#6f8e93; --borda:rgba(57,255,91,.14);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--texto);
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    min-height:100vh; line-height:1.4;
  }
  a{color:var(--turquesa)}
  .wrap{max-width:900px;margin:0 auto;padding:16px}
  header.top{
    display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;
    gap:8px;padding:14px 16px;background:linear-gradient(145deg,var(--panel),var(--petroleo2));
    border:1px solid var(--borda);border-radius:16px;margin-bottom:14px;
  }
  header.top h1{font-size:1.15rem;margin:0}
  .backlink{font-size:.85rem;text-decoration:none;color:var(--cinza)}
  .note{
    font-size:.8rem;color:var(--cinza);background:var(--petroleo2);
    border:1px solid var(--borda);border-radius:12px;padding:9px 12px;margin-bottom:14px;
  }
  .tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  .tabs button{
    flex:1;min-width:100px;padding:11px 8px;border-radius:12px;cursor:pointer;
    background:var(--panel);color:var(--cinza);border:1px solid var(--borda);
    font-size:.92rem;font-weight:600;transition:.15s;
  }
  .tabs button.active{
    background:linear-gradient(145deg,var(--neon),var(--turquesa));
    color:#04161a;border-color:transparent;
  }
  .btn{
    background:linear-gradient(145deg,var(--neon),var(--turquesa));color:#04161a;
    border:none;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;
    font-size:.9rem;
  }
  .btn:hover{filter:brightness(1.08)}
  .btn.ghost{background:var(--panel2);color:var(--texto);border:1px solid var(--borda)}
  .btn.danger{background:transparent;color:#ff7a7a;border:1px solid rgba(255,122,122,.4)}
  .btn.sm{padding:6px 12px;font-size:.8rem}
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:8px}
  .toolbar h2{font-size:1rem;margin:0;color:var(--texto)}
  .cat-group{margin-bottom:20px}
  .cat-title{
    font-size:.95rem;font-weight:700;color:var(--amarelo);margin:0 0 8px;
    padding-bottom:6px;border-bottom:1px solid var(--borda);
  }
  .card{
    background:var(--panel);border:1px solid var(--borda);border-radius:14px;
    padding:12px 14px;margin-bottom:10px;display:flex;justify-content:space-between;
    gap:12px;align-items:flex-start;
  }
  .card .info{flex:1;min-width:0}
  .card .nome{font-weight:700;font-size:.98rem}
  .card .emoji{font-size:1.1rem;margin-right:4px}
  .card .desc{font-size:.8rem;color:var(--cinza);margin-top:2px}
  .card .price{margin-top:4px;font-size:.9rem}
  .price .promo{color:var(--neon);font-weight:700}
  .price .old{color:var(--cinza2);text-decoration:line-through;margin-left:6px;font-size:.82rem}
  .badges{margin-top:6px;display:flex;flex-wrap:wrap;gap:5px}
  .badge{
    font-size:.68rem;padding:2px 8px;border-radius:20px;border:1px solid var(--borda);
    color:var(--cinza);background:var(--petroleo2);white-space:nowrap;
  }
  .badge.on{color:var(--neon);border-color:rgba(57,255,91,.4)}
  .badge.off{color:#ff9a9a;border-color:rgba(255,122,122,.3)}
  .badge.star{color:var(--amarelo);border-color:rgba(255,208,46,.4)}
  .badge.blue{color:var(--turquesa);border-color:rgba(15,184,196,.4)}
  .actions{display:flex;flex-direction:column;gap:6px;flex-shrink:0}
  .empty{color:var(--cinza2);text-align:center;padding:30px;font-size:.9rem}
  /* modal */
  .overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;
    align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto;z-index:50;
  }
  .overlay.show{display:flex}
  .modal{
    background:var(--panel);border:1px solid var(--borda);border-radius:16px;
    padding:20px;width:100%;max-width:480px;margin:auto;
  }
  .modal h3{margin:0 0 14px;font-size:1.05rem}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:.8rem;color:var(--cinza);margin-bottom:5px}
  .field input[type=text],.field input[type=number],.field select,.field textarea{
    width:100%;padding:9px 11px;border-radius:10px;background:var(--petroleo2);
    color:var(--texto);border:1px solid var(--borda);font-size:.9rem;font-family:inherit;
  }
  .field textarea{resize:vertical;min-height:60px}
  .row2{display:flex;gap:10px}
  .row2 .field{flex:1}
  .toggles{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:14px}
  .tg{display:flex;align-items:center;gap:7px;font-size:.85rem;color:var(--cinza);cursor:pointer}
  .tg input{width:18px;height:18px;accent-color:var(--neon)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
  /* login */
  #login{
    position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;
    justify-content:center;padding:20px;z-index:100;
  }
  #login .box{
    background:linear-gradient(145deg,var(--panel),var(--petroleo2));
    border:1px solid var(--borda);border-radius:18px;padding:28px;max-width:340px;width:100%;text-align:center;
  }
  #login h1{font-size:1.3rem;margin:0 0 4px}
  #login p{color:var(--cinza);font-size:.82rem;margin:0 0 18px}
  #login input{
    width:100%;padding:11px;border-radius:10px;background:var(--petroleo2);
    color:var(--texto);border:1px solid var(--borda);margin-bottom:10px;font-size:.95rem;
  }
  #login .err{color:#ff9a9a;font-size:.8rem;min-height:18px;margin-top:4px}
  #app{display:none}
  /* toast */
  #toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);
    background:linear-gradient(145deg,var(--neon),var(--turquesa));color:#04161a;
    padding:11px 22px;border-radius:30px;font-weight:700;font-size:.9rem;
    opacity:0;transition:.3s;z-index:200;pointer-events:none;
  }
  #toast.show{transform:translateX(-50%) translateY(0);opacity:1}
  .loading{color:var(--cinza2);text-align:center;padding:24px}
  .banner-err{
    background:rgba(255,122,122,.1);border:1px solid rgba(255,122,122,.4);
    color:#ff9a9a;border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:.85rem;
  }
</style>
</head>
<body>

<!-- ===== LOGIN GATE (client-side only — não é segurança real) ===== -->
<div id="login">
  <div class="box">
    <h1>Planeta Burger 👽</h1>
    <p>Gerenciador de Cardápio</p>
    <input id="loginUser" type="text" placeholder="Usuário (opcional)" autocomplete="off">
    <input id="loginPass" type="password" placeholder="Senha" autocomplete="off">
    <button class="btn" style="width:100%" onclick="doLogin()">Entrar 🍔</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<!-- ===== APP ===== -->
<div id="app">
  <div class="wrap">
    <header class="top">
      <h1>Planeta Burger 👽 — Cardápio</h1>
      <a class="backlink" href="/admin">← Voltar ao painel</a>
    </header>

    <div class="note">
      As mudanças aparecem no site do cliente quando ele recarrega a página.
    </div>

    <div id="errBanner"></div>

    <div class="tabs">
      <button id="tab-produtos" class="active" onclick="switchTab('produtos')">🍔 Produtos</button>
      <button id="tab-categorias" onclick="switchTab('categorias')">🗂️ Categorias</button>
      <button id="tab-adicionais" onclick="switchTab('adicionais')">➕ Adicionais</button>
    </div>

    <!-- PRODUTOS -->
    <section id="sec-produtos">
      <div class="toolbar">
        <h2>Produtos</h2>
        <button class="btn" onclick="openProduto()">+ Novo produto</button>
      </div>
      <div id="listaProdutos"><div class="loading">Carregando…</div></div>
    </section>

    <!-- CATEGORIAS -->
    <section id="sec-categorias" style="display:none">
      <div class="toolbar">
        <h2>Categorias</h2>
        <button class="btn" onclick="openCategoria()">+ Nova categoria</button>
      </div>
      <div id="listaCategorias"><div class="loading">Carregando…</div></div>
    </section>

    <!-- ADICIONAIS -->
    <section id="sec-adicionais" style="display:none">
      <div class="toolbar">
        <h2>Adicionais</h2>
        <button class="btn" onclick="openAdicional()">+ Novo adicional</button>
      </div>
      <div id="listaAdicionais"><div class="loading">Carregando…</div></div>
    </section>
  </div>
</div>

<!-- ===== MODAL ===== -->
<div class="overlay" id="overlay">
  <div class="modal" id="modalBox"></div>
</div>

<div id="toast">Salvo ✅</div>

<script>
/* ================= SUPABASE CONFIG ================= */
const SUPA = { url:"https://ldjpwamrlbzppkgukmlo.supabase.co", key:"sb_publishable_gkU4l7qMVchUVMT9TXIp_g_0ohm7pp1" };
// Chave publishable pública — ok embutir. RLS/segurança real ficam no Supabase.
const HEADERS = {
  apikey: SUPA.key,
  "Authorization": "Bearer " + SUPA.key,
  "Content-Type": "application/json"
};

/* ================= LOGIN (client-side only) ================= */
const senha = "planeta123"; // Gate somente no cliente, não é segurança real.
function doLogin(){
  const pass = document.getElementById('loginPass').value;
  if(pass === senha){
    document.getElementById('login').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    loadAll();
  } else {
    document.getElementById('loginErr').textContent = 'Senha incorreta.';
  }
}
document.getElementById('loginPass').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });

/* ================= HELPERS ================= */
function brl(v){
  if(v===null || v===undefined || v==="") return "";
  return "R$ " + Number(v).toFixed(2).replace(".",",");
}
// Aceita vírgula ou ponto; retorna número ou null se vazio
function parsePrice(str){
  if(str===null || str===undefined) return null;
  str = String(str).trim();
  if(str==="") return null;
  const n = parseFloat(str.replace(",","."));
  return isNaN(n) ? null : n;
}
function esc(s){
  return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._tm);
  t._tm = setTimeout(()=>t.classList.remove('show'), 1800);
}
function showErr(msg){
  document.getElementById('errBanner').innerHTML =
    '<div class="banner-err">⚠️ ' + esc(msg) + '</div>';
  setTimeout(()=>{ document.getElementById('errBanner').innerHTML=''; }, 6000);
}

/* ================= REST WRAPPERS ================= */
async function apiList(table){
  const res = await fetch(SUPA.url + "/rest/v1/" + table + "?order=ordem.asc", { headers: HEADERS });
  if(!res.ok) throw new Error("Falha ao listar " + table + " (" + res.status + ")");
  return res.json();
}
async function apiCreate(table, obj){
  const res = await fetch(SUPA.url + "/rest/v1/" + table, {
    method: "POST",
    headers: { ...HEADERS, "Prefer": "return=representation" },
    body: JSON.stringify(obj)
  });
  if(!res.ok) throw new Error("Falha ao criar em " + table + " (" + res.status + ")");
  return res.json();
}
async function apiUpdate(table, id, obj){
  const res = await fetch(SUPA.url + "/rest/v1/" + table + "?id=eq." + id, {
    method: "PATCH",
    headers: { ...HEADERS, "Prefer": "return=representation" },
    body: JSON.stringify(obj)
  });
  if(!res.ok) throw new Error("Falha ao atualizar em " + table + " (" + res.status + ")");
  return res.json();
}
async function apiDelete(table, id){
  const res = await fetch(SUPA.url + "/rest/v1/" + table + "?id=eq." + id, {
    method: "DELETE",
    headers: HEADERS
  });
  if(!res.ok) throw new Error("Falha ao excluir em " + table + " (" + res.status + ")");
  return true;
}

/* ================= STATE ================= */
let categorias = [];
let produtos = [];
let adicionais = [];

async function loadAll(){
  await Promise.all([loadCategorias(), loadProdutos(), loadAdicionais()]);
}
async function loadCategorias(){
  try{ categorias = await apiList("categorias"); }
  catch(e){ categorias = []; showErr(e.message); }
  renderCategorias(); renderProdutos();
}
async function loadProdutos(){
  try{ produtos = await apiList("produtos"); }
  catch(e){ produtos = []; showErr(e.message); }
  renderProdutos();
}
async function loadAdicionais(){
  try{ adicionais = await apiList("adicionais"); }
  catch(e){ adicionais = []; showErr(e.message); }
  renderAdicionais();
}

/* ================= TABS ================= */
function switchTab(name){
  ['produtos','categorias','adicionais'].forEach(t=>{
    document.getElementById('sec-'+t).style.display = (t===name)?'block':'none';
    document.getElementById('tab-'+t).classList.toggle('active', t===name);
  });
}

/* ================= RENDER: PRODUTOS ================= */
function renderProdutos(){
  const el = document.getElementById('listaProdutos');
  if(!produtos.length){ el.innerHTML = '<div class="empty">Nenhum produto cadastrado.</div>'; return; }
  // agrupa por categoria
  const byCat = {};
  produtos.forEach(p=>{
    const k = p.categoria_id ?? 'sem';
    (byCat[k] = byCat[k] || []).push(p);
  });
  let html = '';
  categorias.forEach(cat=>{
    const list = byCat[cat.id];
    if(!list || !list.length) return;
    html += '<div class="cat-group"><div class="cat-title">' + esc(cat.emoji||'') + ' ' + esc(cat.nome) + '</div>';
    list.forEach(p=> html += produtoCard(p));
    html += '</div>';
  });
  // sem categoria
  if(byCat['sem'] && byCat['sem'].length){
    html += '<div class="cat-group"><div class="cat-title" style="color:#ff9a9a">⚠️ Sem categoria</div>';
    byCat['sem'].forEach(p=> html += produtoCard(p));
    html += '</div>';
  }
  el.innerHTML = html || '<div class="empty">Nenhum produto cadastrado.</div>';
}
function produtoCard(p){
  let price = '';
  if(p.promo!==null && p.promo!==undefined && p.promo!==""){
    price = '<span class="promo">'+brl(p.promo)+'</span><span class="old">'+brl(p.preco)+'</span>';
  } else {
    price = '<span class="promo">'+brl(p.preco)+'</span>';
  }
  let badges = '';
  badges += p.ativo ? '<span class="badge on">Ativo</span>' : '<span class="badge off">Inativo</span>';
  if(p.destaque) badges += '<span class="badge star">⭐ Destaque</span>';
  if(p.aceita_adicionais) badges += '<span class="badge blue">aceita adicionais</span>';
  return '<div class="card">'
    + '<div class="info">'
    +   '<div class="nome"><span class="emoji">'+esc(p.emoji||'')+'</span>'+esc(p.nome)+'</div>'
    +   (p.descricao?'<div class="desc">'+esc(p.descricao)+'</div>':'')
    +   '<div class="price">'+price+'</div>'
    +   '<div class="badges">'+badges+'</div>'
    + '</div>'
    + '<div class="actions">'
    +   '<button class="btn ghost sm" onclick="openProduto('+p.id+')">Editar</button>'
    +   '<button class="btn danger sm" onclick="delProduto('+p.id+')">Excluir</button>'
    + '</div>'
  + '</div>';
}

/* ================= RENDER: CATEGORIAS ================= */
function renderCategorias(){
  const el = document.getElementById('listaCategorias');
  if(!categorias.length){ el.innerHTML = '<div class="empty">Nenhuma categoria cadastrada.</div>'; return; }
  let html = '';
  categorias.forEach(c=>{
    html += '<div class="card">'
      + '<div class="info">'
      +   '<div class="nome"><span class="emoji">'+esc(c.emoji||'')+'</span>'+esc(c.nome)+'</div>'
      +   '<div class="badges"><span class="badge">ordem '+esc(c.ordem)+'</span>'
      +      (c.ativo?'<span class="badge on">Ativo</span>':'<span class="badge off">Inativo</span>')+'</div>'
      + '</div>'
      + '<div class="actions">'
      +   '<button class="btn ghost sm" onclick="openCategoria('+c.id+')">Editar</button>'
      +   '<button class="btn danger sm" onclick="delCategoria('+c.id+')">Excluir</button>'
      + '</div>'
    + '</div>';
  });
  el.innerHTML = html;
}

/* ================= RENDER: ADICIONAIS ================= */
function renderAdicionais(){
  const el = document.getElementById('listaAdicionais');
  if(!adicionais.length){ el.innerHTML = '<div class="empty">Nenhum adicional cadastrado.</div>'; return; }
  let html = '';
  adicionais.forEach(a=>{
    html += '<div class="card">'
      + '<div class="info">'
      +   '<div class="nome">'+esc(a.nome)+'</div>'
      +   '<div class="price"><span class="promo">'+brl(a.preco)+'</span></div>'
      +   '<div class="badges"><span class="badge">ordem '+esc(a.ordem)+'</span>'
      +      (a.ativo?'<span class="badge on">Ativo</span>':'<span class="badge off">Inativo</span>')+'</div>'
      + '</div>'
      + '<div class="actions">'
      +   '<button class="btn ghost sm" onclick="openAdicional('+a.id+')">Editar</button>'
      +   '<button class="btn danger sm" onclick="delAdicional('+a.id+')">Excluir</button>'
      + '</div>'
    + '</div>';
  });
  el.innerHTML = html;
}

/* ================= MODAL HELPERS ================= */
function openModal(html){
  document.getElementById('modalBox').innerHTML = html;
  document.getElementById('overlay').classList.add('show');
}
function closeModal(){
  document.getElementById('overlay').classList.remove('show');
}
document.getElementById('overlay').addEventListener('click', e=>{
  if(e.target.id==='overlay') closeModal();
});
function val(id){ return document.getElementById(id).value; }
function chk(id){ return document.getElementById(id).checked; }

/* ================= FORM: PRODUTO ================= */
function openProduto(id){
  const p = id ? produtos.find(x=>x.id===id) : null;
  const catOpts = categorias.map(c=>
    '<option value="'+c.id+'"'+(p && p.categoria_id===c.id?' selected':'')+'>'+esc(c.nome)+'</option>'
  ).join('');
  openModal(
    '<h3>'+(p?'Editar produto':'Novo produto')+'</h3>'
    + '<div class="field"><label>Categoria</label><select id="p_cat">'+catOpts+'</select></div>'
    + '<div class="field"><label>Nome</label><input id="p_nome" type="text" value="'+esc(p?p.nome:'')+'"></div>'
    + '<div class="field"><label>Descrição</label><textarea id="p_desc">'+esc(p?p.descricao:'')+'</textarea></div>'
    + '<div class="row2">'
    +   '<div class="field"><label>Preço</label><input id="p_preco" type="text" value="'+(p?String(p.preco??"").replace(".",","):'')+'" placeholder="27,00"></div>'
    +   '<div class="field"><label>Preço promocional (opcional)</label><input id="p_promo" type="text" value="'+(p&&p.promo!=null?String(p.promo).replace(".",","):'')+'" placeholder="—"></div>'
    + '</div>'
    + '<div class="row2">'
    +   '<div class="field"><label>Emoji</label><input id="p_emoji" type="text" value="'+esc(p?p.emoji:(''))+'" placeholder="🍔"></div>'
    +   '<div class="field"><label>Ordem</label><input id="p_ordem" type="number" value="'+(p?(p.ordem??0):0)+'"></div>'
    + '</div>'
    + '<div class="toggles">'
    +   '<label class="tg"><input id="p_ativo" type="checkbox"'+((!p||p.ativo)?' checked':'')+'>Ativo</label>'
    +   '<label class="tg"><input id="p_destaque" type="checkbox"'+(p&&p.destaque?' checked':'')+'>⭐ Destaque</label>'
    +   '<label class="tg"><input id="p_adic" type="checkbox"'+((!p||p.aceita_adicionais)?' checked':'')+'>Aceita adicionais</label>'
    + '</div>'
    + '<div class="modal-actions">'
    +   '<button class="btn ghost" onclick="closeModal()">Cancelar</button>'
    +   '<button class="btn" onclick="saveProduto('+(id||'')+')">Salvar</button>'
    + '</div>'
  );
  // se novo, sugere emoji da categoria selecionada
  if(!p){
    const sel = document.getElementById('p_cat');
    const setEmoji = ()=>{
      const c = categorias.find(x=>String(x.id)===sel.value);
      const eEl = document.getElementById('p_emoji');
      if(c && !eEl.value) eEl.value = c.emoji || '';
    };
    sel.addEventListener('change', ()=>{ document.getElementById('p_emoji').value=''; setEmoji(); });
    setEmoji();
  }
}
async function saveProduto(id){
  const nome = val('p_nome').trim();
  if(!nome){ showErr('Informe o nome do produto.'); return; }
  const obj = {
    categoria_id: Number(val('p_cat')) || null,
    nome: nome,
    descricao: val('p_desc').trim(),
    preco: parsePrice(val('p_preco')) ?? 0,
    promo: parsePrice(val('p_promo')),
    emoji: val('p_emoji').trim(),
    ativo: chk('p_ativo'),
    destaque: chk('p_destaque'),
    aceita_adicionais: chk('p_adic'),
    ordem: Number(val('p_ordem')) || 0
  };
  try{
    if(id) await apiUpdate('produtos', id, obj);
    else await apiCreate('produtos', obj);
    closeModal();
    await loadProdutos();
    showToast('Salvo ✅');
  }catch(e){ showErr(e.message); }
}
async function delProduto(id){
  const p = produtos.find(x=>x.id===id);
  if(!confirm('Excluir o produto "'+(p?p.nome:'')+'"? Esta ação não pode ser desfeita.')) return;
  try{
    await apiDelete('produtos', id);
    await loadProdutos();
    showToast('Excluído');
  }catch(e){ showErr(e.message); }
}

/* ================= FORM: CATEGORIA ================= */
function openCategoria(id){
  const c = id ? categorias.find(x=>x.id===id) : null;
  openModal(
    '<h3>'+(c?'Editar categoria':'Nova categoria')+'</h3>'
    + '<div class="field"><label>Nome</label><input id="c_nome" type="text" value="'+esc(c?c.nome:'')+'"></div>'
    + '<div class="row2">'
    +   '<div class="field"><label>Emoji</label><input id="c_emoji" type="text" value="'+esc(c?c.emoji:'')+'" placeholder="🍔"></div>'
    +   '<div class="field"><label>Ordem</label><input id="c_ordem" type="number" value="'+(c?(c.ordem??0):0)+'"></div>'
    + '</div>'
    + '<div class="toggles">'
    +   '<label class="tg"><input id="c_ativo" type="checkbox"'+((!c||c.ativo)?' checked':'')+'>Ativo</label>'
    + '</div>'
    + '<div class="modal-actions">'
    +   '<button class="btn ghost" onclick="closeModal()">Cancelar</button>'
    +   '<button class="btn" onclick="saveCategoria('+(id||'')+')">Salvar</button>'
    + '</div>'
  );
}
async function saveCategoria(id){
  const nome = val('c_nome').trim();
  if(!nome){ showErr('Informe o nome da categoria.'); return; }
  const obj = {
    nome: nome,
    emoji: val('c_emoji').trim(),
    ordem: Number(val('c_ordem')) || 0,
    ativo: chk('c_ativo')
  };
  try{
    if(id) await apiUpdate('categorias', id, obj);
    else await apiCreate('categorias', obj);
    closeModal();
    await loadCategorias();
    showToast('Salvo ✅');
  }catch(e){ showErr(e.message); }
}
async function delCategoria(id){
  const c = categorias.find(x=>x.id===id);
  const msg = 'Excluir a categoria "'+(c?c.nome:'')+'"?\n\n'
    + 'ATENÇÃO: os produtos dessa categoria ficarão SEM categoria e somem do site do cliente.\n'
    + 'Recomendado mover ou remover os produtos antes.\n\nDeseja continuar?';
  if(!confirm(msg)) return;
  try{
    await apiDelete('categorias', id);
    await Promise.all([loadCategorias(), loadProdutos()]);
    showToast('Excluído');
  }catch(e){ showErr(e.message); }
}

    preco: parsePrice(val('a_preco')) ?? 0,
    ordem: Number(val('a_ordem')) || 0,
    ativo: chk('a_ativo')
  };
